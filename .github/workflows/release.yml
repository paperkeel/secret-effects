name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out the signed tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the signed tag and version
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse origin/master)" || { echo "Tag the current master commit." >&2; exit 1; }
          git -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/signing_allowed_signers" verify-tag "$GITHUB_REF_NAME" || { echo "Use an SSH-signed tag from an allowed signer." >&2; exit 1; }
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" || { echo "The package version must match the tag." >&2; exit 1; }

      - name: Check and build
        run: |
          pnpm check
          pnpm build

      - name: Create the release archive
        id: archive
        run: |
          mkdir -p dist
          archive="dist/secreteffects-${GITHUB_REF_NAME#v}-node.tar.gz"
          tar -czf "$archive" -C apps/cli/dist secreteffects.js
          sha256sum "$archive" > "$archive.sha256"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest the release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.archive.outputs.path }}" \
            "${{ steps.archive.outputs.path }}.sha256" \
            --generate-notes \
            --verify-tag

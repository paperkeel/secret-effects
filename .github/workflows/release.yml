name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: secret-effects-release
  queue: max

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.sha }}
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      npm_integrity: ${{ steps.artifacts.outputs.npm_integrity }}
      npm_package_file: ${{ steps.artifacts.outputs.npm_package_file }}
      published: ${{ steps.release.outputs.published }}
      tag: ${{ steps.artifacts.outputs.tag }}
      tagged: ${{ steps.release.outputs.tagged }}
      version: ${{ steps.artifacts.outputs.version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        run: |
          test "$DEPLOY_SHA" = "$GITHUB_SHA" || { echo "The release event does not match the target commit." >&2; exit 1; }
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)" || { echo "The checkout does not match the release commit." >&2; exit 1; }
          pnpm check
          pnpm build
          pnpm exec wrangler deploy --dry-run --config apps/api/wrangler.jsonc
          pnpm audit --prod --audit-level high

      - name: Build and test release artifacts
        id: artifacts
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: |
          set -o pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          npm_package_file="paperkeel-secret-effects-client-$version.tgz"
          cli_archive_file="secreteffects-$version-node.tar.gz"

          for manifest in \
            apps/api/package.json \
            apps/cli/package.json \
            packages/client/package.json \
            packages/crypto/package.json \
            packages/protocol/package.json
          do
            test "$(node -p "require('./$manifest').version")" = "$version" || { echo "$manifest must use version $version." >&2; exit 1; }
          done

          mkdir -p "$ARTIFACT_DIR"
          (
            cd packages/client
            pnpm pack --pack-destination "$ARTIFACT_DIR"
          )
          test -f "$ARTIFACT_DIR/$npm_package_file" || { echo "The npm package artifact is missing." >&2; exit 1; }

          consumer="$RUNNER_TEMP/client-consumer"
          mkdir -p "$consumer"
          pnpm --dir "$consumer" init
          pnpm --dir "$consumer" add "$ARTIFACT_DIR/$npm_package_file"
          pnpm --dir "$consumer" exec node --input-type=module -e 'const client = await import("@paperkeel/secret-effects-client"); if (typeof client.loadEnv !== "function" || typeof client.defineEnv !== "function" || typeof client.z?.string !== "function") process.exit(1);'

          source_epoch="$(git show -s --format=%ct "$DEPLOY_SHA")"
          tar \
            --sort=name \
            --mtime="@$source_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C apps/cli/dist \
            secreteffects.js \
            | gzip -n > "$ARTIFACT_DIR/$cli_archive_file"

          npm_integrity="$(PACKAGE_PATH="$ARTIFACT_DIR/$npm_package_file" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";

          const bytes = await readFile(process.env.PACKAGE_PATH);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"

          NPM_INTEGRITY="$npm_integrity" \
          NPM_PACKAGE_FILE="$npm_package_file" \
          CLI_ARCHIVE_FILE="$cli_archive_file" \
          RELEASE_TAG="$tag" \
          RELEASE_VERSION="$version" \
          node --input-type=module <<'NODE' > "$ARTIFACT_DIR/release-manifest.json"
          const manifest = {
            cliArchive: process.env.CLI_ARCHIVE_FILE,
            npmIntegrity: process.env.NPM_INTEGRITY,
            npmPackage: "@paperkeel/secret-effects-client",
            npmPackageFile: process.env.NPM_PACKAGE_FILE,
            sourceSha: process.env.DEPLOY_SHA,
            tag: process.env.RELEASE_TAG,
            version: process.env.RELEASE_VERSION,
          };
          process.stdout.write(`${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          (
            cd "$ARTIFACT_DIR"
            sha256sum \
              "$npm_package_file" \
              "$cli_archive_file" \
              release-manifest.json \
              > SHA256SUMS
            sha256sum "$cli_archive_file" > "$cli_archive_file.sha256"
          )

          echo "npm_integrity=$npm_integrity" >> "$GITHUB_OUTPUT"
          echo "npm_package_file=$npm_package_file" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the canonical release state
        id: release
        if: github.repository == 'paperkeel/secret-effects'
        env:
          NPM_INTEGRITY: ${{ steps.artifacts.outputs.npm_integrity }}
          RELEASE_TAG: ${{ steps.artifacts.outputs.tag }}
          RELEASE_VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          published="$(node --input-type=module <<'NODE'
          const name = "@paperkeel/secret-effects-client";
          const response = await fetch(
            `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(process.env.RELEASE_VERSION)}`,
            { signal: AbortSignal.timeout(15_000) },
          );
          if (response.status === 404) {
            process.stdout.write("false");
            process.exit(0);
          }
          if (!response.ok) {
            throw new Error(`The npm registry returned HTTP ${response.status}.`);
          }

          const metadata = await response.json();
          if (metadata.dist?.integrity !== process.env.NPM_INTEGRITY) {
            throw new Error(`${name}@${process.env.RELEASE_VERSION} has different package bytes.`);
          }
          const attestationsUrl = metadata.dist?.attestations?.url;
          if (typeof attestationsUrl !== "string") {
            throw new Error(`${name}@${process.env.RELEASE_VERSION} has no npm provenance.`);
          }
          let attestations;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(attestationsUrl, {
              signal: AbortSignal.timeout(15_000),
            });
            if (response.ok) {
              attestations = await response.json();
              if (
                attestations.attestations?.some(
                  (item) =>
                    item.predicateType === "https://slsa.dev/provenance/v1" &&
                    item.bundle?.dsseEnvelope?.payload,
                )
              ) {
                break;
              }
            } else if (response.status !== 404) {
              throw new Error(`The npm attestation registry returned HTTP ${response.status}.`);
            }
            if (attempt === 12) {
              throw new Error(`${name}@${process.env.RELEASE_VERSION} has no SLSA provenance.`);
            }
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }
          const provenance = attestations.attestations?.find(
            (item) =>
              item.predicateType === "https://slsa.dev/provenance/v1" &&
              item.bundle?.dsseEnvelope?.payload,
          );
          if (!provenance?.bundle?.dsseEnvelope?.payload) {
            throw new Error(`${name}@${process.env.RELEASE_VERSION} has no SLSA provenance.`);
          }
          const statement = JSON.parse(
            Buffer.from(provenance.bundle.dsseEnvelope.payload, "base64").toString("utf8"),
          );
          const expectedDigest = Buffer.from(
            process.env.NPM_INTEGRITY.slice("sha512-".length),
            "base64",
          ).toString("hex");
          const subject = statement.subject?.find(
            (item) => item.digest?.sha512 === expectedDigest,
          );
          const workflow = statement.predicate?.buildDefinition?.externalParameters?.workflow;
          const source = statement.predicate?.buildDefinition?.resolvedDependencies?.find(
            (dependency) => dependency.digest?.gitCommit === process.env.DEPLOY_SHA,
          );
          const builder = statement.predicate?.runDetails?.builder?.id;
          if (
            workflow?.repository !== "https://github.com/paperkeel/secret-effects" ||
            workflow?.path !== ".github/workflows/release.yml" ||
            workflow?.ref !== "refs/heads/master" ||
            !subject ||
            !source ||
            builder !== "https://github.com/actions/runner/github-hosted"
          ) {
            throw new Error(`${name}@${process.env.RELEASE_VERSION} has different source provenance.`);
          }
          process.stdout.write("true");
          NODE
          )"

          tagged=false
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$DEPLOY_SHA" || { echo "$RELEASE_TAG already belongs to another commit." >&2; exit 1; }
            git -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/signing_allowed_signers" verify-tag "$RELEASE_TAG"
            tagged=true
          fi

          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"

      - name: Upload the release artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-effects-${{ env.DEPLOY_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  production:
    needs: prepare
    uses: ./.github/workflows/deploy.yml
    with:
      deploy_sha: ${{ github.sha }}
    secrets: inherit

  publish-npm:
    if: github.repository == 'paperkeel/secret-effects'
    needs: [prepare, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/release-artifacts
      DEPLOY_SHA: ${{ github.sha }}
      NPM_INTEGRITY: ${{ needs.prepare.outputs.npm_integrity }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the trusted npm client
        run: |
          npm install --global npm@12.0.2 --ignore-scripts
          test "$(npm --version)" = "12.0.2" || { echo "The npm client version is not trusted." >&2; exit 1; }

      - name: Download the Blacksmith artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ env.ARTIFACT_DIR }}
          digest-mismatch: error

      - name: Verify the Blacksmith artifact
        id: artifact
        env:
          NPM_PACKAGE_FILE: ${{ needs.prepare.outputs.npm_package_file }}
        run: |
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )
          PACKAGE_PATH="$ARTIFACT_DIR/$NPM_PACKAGE_FILE" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";

          const manifest = JSON.parse(
            await readFile(`${process.env.ARTIFACT_DIR}/release-manifest.json`, "utf8"),
          );
          const expectedFile = `paperkeel-secret-effects-client-${process.env.RELEASE_VERSION}.tgz`;
          if (
            manifest.npmPackage !== "@paperkeel/secret-effects-client" ||
            manifest.npmPackageFile !== expectedFile ||
            manifest.npmPackageFile !== process.env.NPM_PACKAGE_FILE ||
            manifest.npmIntegrity !== process.env.NPM_INTEGRITY ||
            manifest.sourceSha !== process.env.DEPLOY_SHA ||
            manifest.version !== process.env.RELEASE_VERSION
          ) {
            throw new Error("The release manifest does not match the workflow inputs.");
          }
          const bytes = await readFile(process.env.PACKAGE_PATH);
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          if (integrity !== process.env.NPM_INTEGRITY) {
            throw new Error("The npm package integrity does not match the Blacksmith build.");
          }
          NODE
          echo "package_path=$ARTIFACT_DIR/$NPM_PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish with npm Trusted Publishing
        if: needs.prepare.outputs.published != 'true'
        env:
          PACKAGE_PATH: ${{ steps.artifact.outputs.package_path }}
        run: npm publish "$PACKAGE_PATH" --ignore-scripts --access public

      - name: Verify the npm publication
        run: |
          node --input-type=module <<'NODE'
          const name = "@paperkeel/secret-effects-client";
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(process.env.RELEASE_VERSION)}`;
          let metadata;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(url, { signal: AbortSignal.timeout(15_000) });
            if (response.ok) {
              metadata = await response.json();
              if (metadata.dist?.attestations?.url) break;
            } else if (response.status !== 404) {
              throw new Error(`The npm registry returned HTTP ${response.status}.`);
            }
            if (attempt === 12) throw new Error("The npm publication did not become available.");
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }
          if (metadata.dist?.integrity !== process.env.NPM_INTEGRITY) {
            throw new Error("The published npm package has different bytes.");
          }
          let attestations;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(metadata.dist.attestations.url, {
              signal: AbortSignal.timeout(15_000),
            });
            if (response.ok) {
              attestations = await response.json();
              if (
                attestations.attestations?.some(
                  (item) =>
                    item.predicateType === "https://slsa.dev/provenance/v1" &&
                    item.bundle?.dsseEnvelope?.payload,
                )
              ) {
                break;
              }
            } else if (response.status !== 404) {
              throw new Error(`The npm attestation registry returned HTTP ${response.status}.`);
            }
            if (attempt === 12) {
              throw new Error("The npm provenance did not become available.");
            }
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }
          const provenance = attestations.attestations?.find(
            (item) =>
              item.predicateType === "https://slsa.dev/provenance/v1" &&
              item.bundle?.dsseEnvelope?.payload,
          );
          if (!provenance?.bundle?.dsseEnvelope?.payload) {
            throw new Error("The npm package has no SLSA provenance.");
          }
          const statement = JSON.parse(
            Buffer.from(provenance.bundle.dsseEnvelope.payload, "base64").toString("utf8"),
          );
          const expectedDigest = Buffer.from(
            process.env.NPM_INTEGRITY.slice("sha512-".length),
            "base64",
          ).toString("hex");
          const subject = statement.subject?.find(
            (item) => item.digest?.sha512 === expectedDigest,
          );
          const workflow = statement.predicate?.buildDefinition?.externalParameters?.workflow;
          const source = statement.predicate?.buildDefinition?.resolvedDependencies?.find(
            (dependency) => dependency.digest?.gitCommit === process.env.DEPLOY_SHA,
          );
          const builder = statement.predicate?.runDetails?.builder?.id;
          if (
            workflow?.repository !== "https://github.com/paperkeel/secret-effects" ||
            workflow?.path !== ".github/workflows/release.yml" ||
            workflow?.ref !== "refs/heads/master" ||
            !subject ||
            !source ||
            builder !== "https://github.com/actions/runner/github-hosted"
          ) {
            throw new Error("The npm package has different source provenance.");
          }
          NODE

  finalize:
    if: github.repository == 'paperkeel/secret-effects'
    needs: [prepare, production, publish-npm]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/release-artifacts
      DEPLOY_SHA: ${{ github.sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Download the Blacksmith artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ env.ARTIFACT_DIR }}
          digest-mismatch: error

      - name: Verify the release artifact
        run: |
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)" || { echo "The checkout does not match the released commit." >&2; exit 1; }
          test -n "$TAG" || { echo "The release tag is missing." >&2; exit 1; }
          test -n "$VERSION" || { echo "The release version is missing." >&2; exit 1; }
          (
            cd "$ARTIFACT_DIR"
            sha256sum --check SHA256SUMS
          )

      - name: Create the signed release tag
        if: needs.prepare.outputs.tagged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY" || { echo "Set RELEASE_SIGNING_PRIVATE_KEY in the release environment." >&2; exit 1; }
          signing_key="$RUNNER_TEMP/paperkeel-release-signing-key"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          git config user.name "Paperkeel Release"
          git config user.email "paperkeel-release@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$signing_key"
          git config tag.gpgSign true
          git tag --sign "$TAG" "$DEPLOY_SHA" --message "Release $TAG"
          gh auth setup-git
          git push origin "refs/tags/$TAG"

      - name: Attest the release archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT_DIR }}/secreteffects-${{ needs.prepare.outputs.version }}-node.tar.gz

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            "$ARTIFACT_DIR/secreteffects-$VERSION-node.tar.gz" \
            "$ARTIFACT_DIR/secreteffects-$VERSION-node.tar.gz.sha256" \
            --generate-notes \
            --verify-tag
